name: Padlet Auto Bot (Python)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Padlet Board URL'
        required: true
        type: string
      message:
        description: 'Post / Comment Message'
        required: true
        default: 'お前らやりませんね杉！！ここはさーもんの集いに荒らされました！ｗ今すぐサーモンの集いに参加！https://sus5.netlify.app/#SamonTudoiPado パスワードがわからない人はあきらめてねー！ww普通はわかるけどねwww荒らすことだけしか考えれないのかｗｗｗ ぜひ参加してねww 荒らし対策もうちょっとしてね～wwもっと頑張ってねwwじゃあお疲れｗそんじゃがんばれがんばれｗｗ！！'
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Pythonのセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係のインストール & Playwrightの導入
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: ボットの実行
        env:
          AUTH_JSONS: ${{ secrets.AUTH_JSONS }}
          TARGET_URL: ${{ inputs.target_url }}
          CUSTOM_MESSAGE: ${{ inputs.message }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
