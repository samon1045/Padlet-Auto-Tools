name: Padlet Playwright Bot

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '投稿先のPadletの部屋のURL'
        required: true
        type: string
      message:
        description: '送信するメッセージ'
        required: false
        default: 'おまえらやりませんねぇ杉！！'
        type: string

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存関係のインストール
        run: npm install

      - name: Playwrightブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: ボットの実行
        run: node bot.js
        env:
          AUTH_JSON: ${{ secrets.AUTH_JSON }}
          TARGET_URL: ${{ inputs.target_url }}
          CUSTOM_MESSAGE: ${{ inputs.message }}
