name: Run Padlet Bot

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '対象のPadlet URL'
        required: true
        default: ''
      total_rounds:
        description: '実行ラウンド数'
        required: true
        default: '2'
      enable_post:
        description: '投稿を行うか (true/false)'
        required: true
        default: 'true'
      enable_comment:
        description: 'コメントを行うか (true/false)'
        required: true
        default: 'true'
      use_guest:
        description: 'フリー(ゲスト)アカウントで実行するか (true/false)'
        required: true
        default: 'false'
      title_message:
        description: '投稿のタイトル'
        required: false
        default: 'シベリア共栄圏にさんか！！https://script.google.com/macros/s/AKfycbxvrapbCANCrtEeIA-tK8OdAWwNo4P3U7W1XQ8qz-FAN1wBEIIaLbajKFcZ5LMKKYgxUQ/exec'
      custom_message:
        description: '投稿本文およびコメントメッセージ'
        required: false
        default: 'お前らやりませんね杉！！ここはシベリア共栄圏に荒らされました！ｗ今すぐシベリア共栄圏に参加！https://script.google.com/macros/s/AKfycbxvrapbCANCrtEeIA-tK8OdAWwNo4P3U7W1XQ8qz-FAN1wBEIIaLbajKFcZ5LMKKYgxUQ/exec パスワードがわからない人はあきらめてねー！ww普通はわかるけどねwww荒らしかえすことだけしか考えれないのかｗｗｗ ぜひ参加してねww 荒らし対策もうちょっとしてね～wwもっと頑張ってねwwじゃあお疲れｗそんじゃがんばれがんばれｗｗ'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            npm init -y && npm install playwright
          fi

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Bot
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          AUTH_JSONS: ${{ secrets.AUTH_JSONS }}
          TOTAL_ROUNDS: ${{ github.event.inputs.total_rounds }}
          ENABLE_POST: ${{ github.event.inputs.enable_post }}
          ENABLE_COMMENT: ${{ github.event.inputs.enable_comment }}
          USE_GUEST: ${{ github.event.inputs.use_guest }}
          TITLE_MESSAGE: ${{ github.event.inputs.title_message }}
          CUSTOM_MESSAGE: ${{ github.event.inputs.custom_message }}
        run: node bot.js

      - name: Upload Recorded Video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: padlet-bot-video
          path: videos/
