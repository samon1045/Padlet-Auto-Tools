name: Padlet Playwright Bot

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存関係のインストール
        run: npm install

      - name: Playwrightブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: ボットの実行
        run: node bot.js
        env:
          PADLET_EMAIL: ${{ secrets.PADLET_EMAIL }}
          PADLET_PASSWORD: ${{ secrets.PADLET_PASSWORD }}

      - name: スクリーンショットを保存（成果物としてアップロード）
        uses: actions/upload-artifact@v4
        if: always() # エラーで止まっても必ずスクショを保存する
        with:
          name: login-page-screenshot
          path: login-page.png
