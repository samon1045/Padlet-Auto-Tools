name: Run Padlet Bot

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: '対象のPadlet URL'
        required: true
        default: 'https://padlet.com/kamisngi/daiki-o1ocnzud4hb082q'
      total_rounds:
        description: '実行ラウンド数'
        required: true
        default: '2'
      enable_post:
        description: '投稿を行うか (true/false)'
        required: true
        default: 'true'
      enable_comment:
        description: 'コメントを行うか (true/false)'
        required: true
        default: 'true'
      use_guest:
        description: 'フリー(ゲスト)アカウントで実行するか (true/false)'
        required: true
        default: 'false'
      title_message:
        description: '投稿のタイトル'
        required: false
        default: 'さーもんの集いにさんか！！https://sus5.netlify.app/#SamonTudoiPado'
      custom_message:
        description: '投稿本文およびコメントメッセージ'
        required: false
        default: 'お前らやりませんね杉！！ここはさーもんの集いに荒らされました！ｗ今すぐサーモンの集いに参加！https://sus5.netlify.app/#SamonTudoiPado パスワードがわからない人はあきらめてねー！ww普通はわかるけどねwww荒らしかえすことだけしか考えれないのかｗｗｗ ぜひ参加してねww 荒らし対策もうちょっとしてね～wwもっと頑張ってねwwじゃあお疲れｗそんじゃがんばれがんばれｗｗ'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: playwright install chromium --with-deps

      - name: Run Bot
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          AUTH_JSONS: ${{ secrets.AUTH_JSONS }}
          TOTAL_ROUNDS: ${{ github.event.inputs.total_rounds }}
          ENABLE_POST: ${{ github.event.inputs.enable_post }}
          ENABLE_COMMENT: ${{ github.event.inputs.enable_comment }}
          USE_GUEST: ${{ github.event.inputs.use_guest }}
          TITLE_MESSAGE: ${{ github.event.inputs.title_message }}
          CUSTOM_MESSAGE: ${{ github.event.inputs.custom_message }}
        run: python request.py

      - name: Upload Recorded Video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: padlet-bot-video
          path: videos/
