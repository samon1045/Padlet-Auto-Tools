name: Padlet Auto Bot (JS)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Padlet Board URL'
        required: true
        type: string
      message:
        description: 'Post / Comment Message'
        required: true
        default: 'お前らやりませんね杉！！ここはさーもんの集いに荒らされました！ｗ今すぐサーモンの集いに参加！'
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 依存関係のインストール & Playwrightブラウザの導入
        run: |
          npm ci || npm install
          npx playwright install chromium

      - name: ボットの実行
        env:
          AUTH_JSONS: ${{ secrets.AUTH_JSONS }}
          TARGET_URL: ${{ inputs.target_url }}
          CUSTOM_MESSAGE: ${{ inputs.message }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          node bot.js

      - name: Upload Recorded Video
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-recording
          path: videos/
