name: Padlet Playwright Bot

on:
  workflow_dispatch: # GitHubの画面から手動でボタンをポチッと押して動かせるようにする設定
  schedule:
    - cron: '' # 毎日決まった時間に自動で動かしたい場合（必要なら設定）

jobs:
  run-automation:
    runs-on: ubuntu-latest # GitHubのクラウド上にある最新のLinuxパソコンを使う
    steps:
      - name: ソースコードの取得
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存関係のインストール
        run: npm install

      - name: Playwrightブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: ボットの実行
        run: node bot.js
        env:
          PADLET_EMAIL: ${{ secrets.PADLET_EMAIL }}       # GitHubに登録したメールアドレスを安全に渡す
          PADLET_PASSWORD: ${{ secrets.PADLET_PASSWORD }} # GitHubに登録したパスワードを安全に渡す
