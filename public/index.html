<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padlet Auto Runner</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #a0a0a0;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            background-color: #121212;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
            font-family: inherit;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #888;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #cccccc;
        }
        #status {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #00ff66;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>PADLET AUTO POSTER</h2>
    
    <div class="form-group">
        <label>パドレットの部屋URL</label>
        <input type="text" id="targetUrl" placeholder="https://padlet.com/username/board-id">
    </div>

    <div class="form-group">
        <label>送信メッセージ</label>
        <textarea id="message" rows="3">おまえらやりませんねぇ杉！！</textarea>
    </div>

    <button onclick="submitTask()">送信して実行</button>

    <div id="status"></div>
</div>

<script>
async function submitTask() {
    const targetUrl = document.getElementById('targetUrl').value.trim();
    const message = document.getElementById('message').value.trim();
    const statusDiv = document.getElementById('status');

    if (!targetUrl) {
        statusDiv.style.color = '#ff4444';
        statusDiv.textContent = 'URLを入力してください。';
        return;
    }

    statusDiv.style.color = '#888888';
    statusDiv.textContent = 'ボット起動リクエストを送信中...';

    try {
        const res = await fetch('/api/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ targetUrl, message })
        });
        const data = await res.json();
        
        if (data.success) {
            statusDiv.style.color = '#00ff66';
            statusDiv.textContent = data.message;
        } else {
            statusDiv.style.color = '#ff4444';
            statusDiv.textContent = data.error;
        }
    } catch (err) {
        statusDiv.style.color = '#ff4444';
        statusDiv.textContent = '通信エラーが発生しました。';
    }
}
</script>

</body>
</html>
